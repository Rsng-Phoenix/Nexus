# Nexus reminder relay. Free Cloudflare Workers plan is plenty (1 cron/minute + a few requests per edit).
name = "nexus-push"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

# Web app origins allowed to call the worker (comma separated).
[vars]
ALLOWED_ORIGINS = "https://rsng-phoenix.github.io,http://localhost:5173,http://localhost:4173"
VAPID_SUBJECT = "https://rsng-phoenix.github.io/Nexus/"
# Public OAuth client id (same as the web app). The secret is a Cloudflare secret, never here.
GOOGLE_CLIENT_ID = "273347997748-6nmu1ji56r2of8f7604fpcbr94hu9qm9.apps.googleusercontent.com"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "nexus-push"
database_id = "8b2d600c-7125-4aca-9ceb-2ceb69c07741"

# Per-IP limit on everything that writes or does work (free on every Workers plan).
# 60 calls a minute per IP per route is far above what one person's devices need.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
